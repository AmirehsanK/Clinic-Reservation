name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Clinic_Reservation.sln

      - name: Build
        run: dotnet build Clinic_Reservation.sln -c Release --no-restore

      - name: Test
        run: dotnet test Clinic.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: Clinic.Tests/TestResults/*.trx

  e2e:
    name: End-to-end HTTP suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Builds the app, starts it against a fresh SQLite database and runs
      # full_test.sh (105 assertions) through the real HTTP surface.
      - name: Run full_test.sh
        shell: pwsh
        run: ./run-tests.ps1

      - name: App log
        if: failure()
        run: cat /tmp/app_full.log /tmp/app_full.log.err || true

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the app to report ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready; then echo; exit 0; fi
            sleep 3
          done
          echo "App never became ready" >&2
          exit 1

      - name: Sign-in page renders
        run: curl -fsS http://localhost:8080/Account/Login -o /dev/null

      - name: Compose logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
