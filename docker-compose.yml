# Local demo: the app, SQL Server and an OpenTelemetry dashboard.
#
#   docker compose up --build
#
#   App        http://localhost:8080   (APP_PORT to change it; sign in with 09120000000; the code is in `docker compose logs app`)
#   Dashboard  http://localhost:18888  (traces, metrics and logs from the app)
#
# The SA password below is a throwaway for this local demo only. Override it
# with MSSQL_SA_PASSWORD in your shell or a .env file; never reuse it anywhere real.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Clinic_Local_Demo_123}
    volumes:
      - clinic-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=ClinicReservationDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Clinic_Local_Demo_123};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Database__SeedDemoData: "true"
      SeedAdmin__Mobile: "09120000000"
      SeedAdmin__FullName: "Demo Admin"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://dashboard:18889"
      OTEL_SERVICE_NAME: clinic-reservation
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    ports:
      - "18888:18888"
    environment:
      # Local demo only: no login on the dashboard UI or the OTLP endpoint.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

volumes:
  clinic-sql:
